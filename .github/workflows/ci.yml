name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal read-only permissions for all jobs by default.
# Individual jobs may declare additional permissions explicitly.
permissions:
  contents: read

env:
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "11.24.0"

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history for whitespace delta check

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage
        env:
          APP_ENV: test
          NEXT_PUBLIC_TENANT_ID: ci-tenant
          FEATURE_MAINTENANCE: "false"
          NODE_ENV: test

      - name: Build (production)
        run: pnpm build
        env:
          APP_ENV: production
          NEXT_PUBLIC_TENANT_ID: ci-tenant
          FEATURE_MAINTENANCE: "false"
          NODE_ENV: production

      - name: Audit dependencies
        run: pnpm audit
        continue-on-error: false

      - name: Check whitespace errors (committed delta)
        run: |
          # Resolve the comparison base depending on the event type.
          # On a pull_request, compare the PR head against its merge base.
          # On a push, compare the current commit against its parent,
          # handling the edge case of an initial push with no prior SHA.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # First push on a new branch — compare against the empty tree
            BASE_SHA=$(git hash-object -t tree /dev/null)
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          git diff --check "$BASE_SHA" HEAD

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for accidental secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
