name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal read-only permissions for all jobs by default.
permissions:
  contents: read

env:
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "11.24.0"

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage
        env:
          APP_ENV: test
          NEXT_PUBLIC_TENANT_ID: ci-tenant
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-anon-key-ci
          FEATURE_MAINTENANCE: "false"
          NODE_ENV: test

      - name: Build (production)
        run: pnpm build
        env:
          APP_ENV: production
          NEXT_PUBLIC_TENANT_ID: ""
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-build-key
          FEATURE_MAINTENANCE: "false"
          NODE_ENV: production

      - name: Audit dependencies
        run: pnpm audit
        continue-on-error: false

      - name: Check whitespace errors (committed delta)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          git diff --check "$BASE_SHA" HEAD

  supabase-local:
    name: Supabase local DB tests (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ce job nécessite Docker — disponible sur ubuntu-latest GitHub Actions.
    # Il est séparé du job CI principal pour ne pas bloquer lint/typecheck si Docker est lent.

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Supabase CLI via pnpm
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local stack
        run: npx supabase start

      - name: Reset DB and apply migrations + seed
        run: npx supabase db reset

      - name: Run pgTAP RLS tests
        run: npx supabase test db

      - name: Generate TypeScript types (verify freshness)
        run: |
          npx supabase gen types typescript --local > /tmp/generated.types.ts
          diff src/lib/database.types.ts /tmp/generated.types.ts || echo "WARNING: database.types.ts needs regeneration"

      - name: Check DB advisors
        run: npx supabase db advisors || true

      - name: Stop Supabase local stack
        if: always()
        run: npx supabase stop

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for accidental secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
